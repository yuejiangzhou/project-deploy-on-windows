version: '3.8'

services:
  mysql:
    image: proxy.vvvv.ee/mysql:8.0.27
    pull_policy: never
    container_name: deploy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: deploy_manager
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy-manager-backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --lower_case_table_names=2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: proxy.vvvv.ee/minio/minio:RELEASE.2024-06-11T03-13-30Z
    pull_policy: never
    container_name: deploy-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API 端口（后端连接用）
      - "9001:9001"   # 控制台端口（浏览器访问）
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 可选：自动创建 MinIO 的 bucket
  minio-init:
    image: proxy.vvvv.ee/minio/mc:latest
    pull_policy: never
    container_name: deploy-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/project-files &&
      mc mb -p local/infra-components &&
      mc mb -p local/packages &&
      echo 'Buckets created successfully.'
      "
    restart: "no"

volumes:
  mysql-data:
  minio-data:
