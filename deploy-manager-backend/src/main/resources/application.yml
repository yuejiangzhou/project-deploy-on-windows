server:
  port: 9090
  tomcat:
    relaxed-query-chars: '|,{,},[,]'
    uri-encoding: UTF-8

spring:
  application:
    name: deploy-manager
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://localhost:3306/deploy_manager?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000
      idle-timeout: 600000
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  freemarker:
    template-loader-path: classpath:/scripts/templates/
    suffix: .ftl
    charset: UTF-8

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 使用 Slf4j 打印 SQL，走 logback（带时间戳/级别/线程）；StdOutImpl 是 System.out.println，无日志格式
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-project-files: project-files
  bucket-infra-components: infra-components
  bucket-packages: packages

package:
  temp-dir: ${PACKAGE_TEMP_DIR:./temp/packages}
  max-concurrent-tasks: 2

# 日志相关（logback-spring.xml 读取这些值；可通过环境变量覆盖）
logging:
  file:
    path: ${LOG_PATH:logs}
  level:
    root: INFO
    com.company.deploy: DEBUG
    com.company.deploy.mapper: DEBUG
    org.springframework: INFO
    io.minio: INFO

