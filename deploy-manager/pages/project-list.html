<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目管理 - DeployManager</title>
    <style id="theme-vars">
:root {
  /* === Brand Colors === */
  --color-primary: #3B82F6;
  --color-primary-hover: #2563EB;
  --color-primary-light: #EFF6FF;
  --color-primary-text: #1E40AF;

  /* === Neutral Scale === */
  --color-bg: #F8FAFC;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #F1F5F9;
  --color-bg-muted: #E2E8F0;
  --color-border: #CBD5E1;
  --color-border-light: #E2E8F0;
  --color-text-primary: #0F172A;
  --color-text-secondary: #475569;
  --color-text-tertiary: #94A3B8;
  --color-text-inverse: #FFFFFF;

  /* === State Colors === */
  --state-success: #16A34A;
  --state-success-bg: #F0FDF4;
  --state-warning: #D97706;
  --state-warning-bg: #FFFBEB;
  --state-error: #DC2626;
  --state-error-bg: #FEF2F2;
  --state-info: #2563EB;
  --state-info-bg: #EFF6FF;

  /* === Radius === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* === Typography === */
  --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;

  /* === Shadows === */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 2px 4px rgba(0, 0, 0, 0.04);
  --shadow-float: 0 8px 24px rgba(0, 0, 0, 0.08);

  /* === Spacing === */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: 48px;
}

/* === Typography Classes === */
.font-heading { font-family: var(--font-family); font-weight: 600; letter-spacing: -0.01em; }
.font-body { font-family: var(--font-family); font-weight: 400; }
.font-mono { font-family: var(--font-mono); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="flex min-h-screen" style="background: var(--color-bg);">
      <!-- Sidebar -->
      <aside class="flex flex-col justify-between" style="width: 220px; background: #0F172A; min-height: 100vh; padding: 0;">
        <!-- Sidebar Header -->
        <div>
          <div class="flex items-center gap-2 px-5 py-4" style="border-bottom: 1px solid rgba(255,255,255,0.08);">
            <i data-lucide="rocket" style="color: #3B82F6; width: 20px; height: 20px;"></i>
            <span class="font-heading text-base" style="color: #FFFFFF;">DeployManager</span>
          </div>
          <!-- Nav Items -->
          <nav class="mt-2 px-3 flex flex-col gap-1">
            <a data-dom-id="sidebar-nav-project" href="#" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm font-medium no-underline" style="background: #3B82F6; color: #FFFFFF;">
              <i data-lucide="folder-open" style="width: 16px; height: 16px;"></i>
              项目管理
            </a>
            <a data-dom-id="sidebar-nav-upload" href="#" class="flex items-center gap-3 px-3 py-2 rounded-md text-sm font-normal no-underline" style="color: #94A3B8;">
              <i data-lucide="upload-cloud" style="width: 16px; height: 16px;"></i>
              资源上传
            </a>

          </nav>
        </div>
        <!-- Sidebar Footer -->
        <div class="px-5 py-4" style="border-top: 1px solid rgba(255,255,255,0.08);">
          <div class="flex items-center gap-2">
            <span class="inline-block w-2 h-2 rounded-full" style="background: #22C55E;"></span>
            <span class="text-xs" style="color: #94A3B8;">系统正常运行 v2.5.0</span>
          </div>
        </div>
      </aside>

      <!-- Right Content Area -->
      <div class="flex-1 flex flex-col" style="min-width: 0;">
        <!-- Top Header Bar -->
        <header class="flex items-center justify-between px-6 py-3" style="background: var(--color-bg-elevated); border-bottom: 1px solid var(--color-border-light); box-shadow: var(--shadow-sm);">
          <!-- Breadcrumb -->
          <div class="flex items-center gap-2 text-sm" style="color: var(--color-text-secondary);">
            <span class="font-medium" style="color: var(--color-text-primary);">项目管理</span>
          </div>
          <!-- User Area -->
          <div class="flex items-center gap-3">
            <div class="relative">
              <i data-lucide="bell" style="width: 18px; height: 18px; color: var(--color-text-tertiary);"></i>
              <span class="absolute -top-1 -right-1 w-2 h-2 rounded-full" style="background: var(--state-error);"></span>
            </div>
            <div class="flex items-center gap-2 pl-3" style="border-left: 1px solid var(--color-border-light);">
              <div class="flex items-center justify-center w-8 h-8 rounded-full text-xs font-medium" style="background: var(--color-primary-light); color: var(--color-primary);">管</div>
              <span class="text-sm font-medium" style="color: var(--color-text-primary);">管理员</span>
            </div>
          </div>
        </header>

        <!-- Main Content -->
        <div class="flex-1 p-6 overflow-auto">
          <!-- Page Title Row -->
          <div class="flex items-center justify-between mb-6">
            <h1 class="font-heading text-xl" style="color: var(--color-text-primary);">项目管理</h1>
            <div class="flex items-center gap-2">
              <button id="btn-new-project" class="flex items-center gap-1.5 px-4 py-2 rounded-md text-sm font-medium cursor-pointer border-0" style="background: var(--color-primary); color: var(--color-text-inverse);">
                <i data-lucide="plus" style="width: 16px; height: 16px;"></i>
                新建项目
              </button>
            </div>
          </div>

          <!-- Stats Cards (2 only) -->
          <div class="grid gap-4 mb-6" style="grid-template-columns: repeat(2, 1fr);">
            <!-- Card: 总项目数 -->
            <div class="rounded-lg p-4" style="background: var(--color-bg-elevated); border: 1px solid var(--color-border-light); box-shadow: var(--shadow-sm);">
              <div class="flex items-center gap-2 mb-2">
                <i data-lucide="folder" style="width: 16px; height: 16px; color: var(--color-text-tertiary);"></i>
                <span class="text-sm" style="color: var(--color-text-secondary);">总项目数</span>
              </div>
              <div class="font-heading text-2xl" style="color: var(--color-primary);">6</div>
            </div>
            <!-- Card: 已打包数 -->
            <div class="rounded-lg p-4" style="background: var(--color-bg-elevated); border: 1px solid var(--color-border-light); box-shadow: var(--shadow-sm);">
              <div class="flex items-center gap-2 mb-2">
                <i data-lucide="package-check" style="width: 16px; height: 16px; color: var(--color-text-tertiary);"></i>
                <span class="text-sm" style="color: var(--color-text-secondary);">已打包数</span>
              </div>
              <div class="font-heading text-2xl" style="color: var(--state-success);">12</div>
            </div>
          </div>

          <!-- Search Bar (simplified, no filter buttons) -->
          <div class="flex items-center gap-3 mb-4">
            <div class="relative flex-1" style="max-width: 320px;">
              <i data-lucide="search" class="absolute left-3 top-1/2" style="transform: translateY(-50%); width: 16px; height: 16px; color: var(--color-text-tertiary);"></i>
              <input type="text" placeholder="搜索项目..." class="w-full pl-9 pr-3 py-2 rounded-md text-sm outline-none" style="background: var(--color-bg-elevated); border: 1px solid var(--color-border); color: var(--color-text-primary);" />
            </div>
          </div>

          <!-- Project Table -->
          <div class="rounded-lg overflow-hidden" style="background: var(--color-bg-elevated); border: 1px solid var(--color-border-light); box-shadow: var(--shadow-sm);">
            <table class="w-full" style="border-collapse: collapse;">
              <thead>
                <tr style="border-bottom: 1px solid var(--color-border-light);">
                  <th class="text-left px-4 py-3 text-xs font-medium" style="color: var(--color-text-tertiary); background: var(--color-bg-sunken);">项目名称</th>
                  <th class="text-left px-4 py-3 text-xs font-medium" style="color: var(--color-text-tertiary); background: var(--color-bg-sunken);">JAR包</th>
                  <th class="text-left px-4 py-3 text-xs font-medium" style="color: var(--color-text-tertiary); background: var(--color-bg-sunken);">Vue前端</th>
                  <th class="text-left px-4 py-3 text-xs font-medium" style="color: var(--color-text-tertiary); background: var(--color-bg-sunken);">状态</th>
                  <th class="text-right px-4 py-3 text-xs font-medium" style="color: var(--color-text-tertiary); background: var(--color-bg-sunken);">操作</th>
                </tr>
              </thead>
              <tbody>
                <!-- Row 1: 电商平台 -->
                <tr class="table-row-hover" style="border-bottom: 1px solid var(--color-border-light);">
                  <td class="px-4 py-3">
                    <div class="flex items-center gap-2.5">
                      <div class="flex items-center justify-center w-8 h-8 rounded-md" style="background: #EFF6FF;">
                        <i data-lucide="shopping-cart" style="width: 16px; height: 16px; color: var(--color-primary);"></i>
                      </div>
                      <div>
                        <div class="text-sm font-medium" style="color: var(--color-text-primary);">电商平台</div>
                      </div>
                    </div>
                  </td>
                  <td class="px-4 py-3">
                    <span class="text-sm font-mono" style="color: var(--color-text-secondary);">app-v2.1.0.jar</span>
                  </td>
                  <td class="px-4 py-3">
                    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium" style="background: var(--state-success-bg); color: var(--state-success);">已配置</span>
                  </td>
                  <td class="px-4 py-3">
                    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium" style="background: var(--state-success-bg); color: var(--state-success);">已就绪</span>
                  </td>
                  <td class="px-4 py-3 text-right">
                    <div class="flex items-center justify-end gap-2">
                      <span data-dom-id="btn-project-detail" class="hidden"></span><button data-dom-id="btn-project-config" class="px-3 py-1 rounded text-xs font-medium cursor-pointer border-0" style="background: var(--color-primary); color: var(--color-text-inverse);">配置</button>                      <button data-dom-id="btn-project-package" class="px-3 py-1 rounded text-xs font-medium cursor-pointer border-0" style="background: var(--state-success); color: var(--color-text-inverse);">打包</button>                      <button class="download-btn flex items-center gap-1.5 px-3 py-1 rounded text-xs font-medium cursor-pointer transition-colors" data-has-package="true" style="border:1px solid var(--color-border); color:var(--color-text-secondary); background:var(--color-bg-elevated);"
                              onmouseenter="this.style.borderColor='var(--color-primary)'; this.style.color='var(--color-primary)'"
                              onmouseleave="this.style.borderColor='var(--color-border)'; this.style.color='var(--color-text-secondary)'">
                        <i data-lucide="download" style="width:13px;height:13px;"></i>
                        <span>下载最新版本</span>
                      </button>                      <button class="px-3 py-1 rounded text-xs font-medium cursor-pointer border-0" style="background: var(--color-bg-sunken); color: var(--color-text-secondary);">删除</button>
                    </div>
                  </td>
                </tr>
                <!-- Row 2: 数据中台 -->
                <tr class="table-row-hover" style="border-bottom: 1px solid var(--color-border-light);">
                  <td class="px-4 py-3">
                    <div class="flex items-center gap-2.5">
                      <div class="flex items-center justify-center w-8 h-8 rounded-md" style="background: #F0FDF4;">
                        <i data-lucide="database" style="width: 16px; height: 16px; color: var(--state-success);"></i>
                      </div>
                      <div>
                        <div class="text-sm font-medium" style="color: var(--color-text-primary);">数据中台</div>
                      </div>
                    </div>
                  </td>
                  <td class="px-4 py-3">
                    <span class="text-sm font-mono" style="color: var(--color-text-secondary);">data-api-v1.0.jar</span>
                  </td>
                  <td class="px-4 py-3">
                    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium" style="background: var(--color-bg-sunken); color: var(--color-text-tertiary);">未配置</span>
                  </td>
                  <td class="px-4 py-3">
                    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium" style="background: var(--state-info-bg); color: var(--state-info);">配置中</span>
                  </td>
                  <td class="px-4 py-3 text-right">
                    <div class="flex items-center justify-end gap-2">
                      <button data-dom-id="btn-project-config" class="px-3 py-1 rounded text-xs font-medium cursor-pointer border-0" style="background: var(--color-primary); color: var(--color-text-inverse);">配置</button>
                      <button data-dom-id="btn-project-package" class="px-3 py-1 rounded text-xs font-medium cursor-pointer border-0" style="background: var(--state-success); color: var(--color-text-inverse);">打包</button>
                      <button class="download-btn flex items-center gap-1.5 px-3 py-1 rounded text-xs font-medium cursor-pointer transition-colors" data-has-package="false" data-project-name="数据中台" style="border:1px solid var(--color-border); color:var(--color-text-secondary); background:var(--color-bg-elevated);"
                              onmouseenter="this.style.borderColor='var(--color-primary)'; this.style.color='var(--color-primary)'"
                              onmouseleave="this.style.borderColor='var(--color-border)'; this.style.color='var(--color-text-secondary)'">
                        <i data-lucide="download" style="width:13px;height:13px;"></i>
                        <span>下载最新版本</span>
                      </button>
                      <button class="px-3 py-1 rounded text-xs font-medium cursor-pointer border-0" style="background: var(--color-bg-sunken); color: var(--color-text-secondary);">删除</button>
                    </div>
                  </td>
                </tr>
                <!-- Row 3: 用户系统 -->
                <tr class="table-row-hover" style="border-bottom: 1px solid var(--color-border-light);">
                  <td class="px-4 py-3">
                    <div class="flex items-center gap-2.5">
                      <div class="flex items-center justify-center w-8 h-8 rounded-md" style="background: #EFF6FF;">
                        <i data-lucide="users" style="width: 16px; height: 16px; color: var(--color-primary);"></i>
                      </div>
                      <div>
                        <div class="text-sm font-medium" style="color: var(--color-text-primary);">用户系统</div>
                      </div>
                    </div>
                  </td>
                  <td class="px-4 py-3">
                    <span class="text-sm font-mono" style="color: var(--color-text-secondary);">user-sys-v3.0.jar</span>
                  </td>
                  <td class="px-4 py-3">
                    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium" style="background: var(--state-success-bg); color: var(--state-success);">已配置</span>
                  </td>
                  <td class="px-4 py-3">
                    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium" style="background: var(--state-success-bg); color: var(--state-success);">已就绪</span>
                  </td>
                  <td class="px-4 py-3 text-right">
                    <div class="flex items-center justify-end gap-2">
                      <button data-dom-id="btn-project-config" class="px-3 py-1 rounded text-xs font-medium cursor-pointer border-0" style="background: var(--color-primary); color: var(--color-text-inverse);">配置</button>
                      <button data-dom-id="btn-project-package" class="px-3 py-1 rounded text-xs font-medium cursor-pointer border-0" style="background: var(--state-success); color: var(--color-text-inverse);">打包</button>
                      <button class="download-btn flex items-center gap-1.5 px-3 py-1 rounded text-xs font-medium cursor-pointer transition-colors" data-has-package="true" style="border:1px solid var(--color-border); color:var(--color-text-secondary); background:var(--color-bg-elevated);"
                              onmouseenter="this.style.borderColor='var(--color-primary)'; this.style.color='var(--color-primary)'"
                              onmouseleave="this.style.borderColor='var(--color-border)'; this.style.color='var(--color-text-secondary)'">
                        <i data-lucide="download" style="width:13px;height:13px;"></i>
                        <span>下载最新版本</span>
                      </button>
                      <button class="px-3 py-1 rounded text-xs font-medium cursor-pointer border-0" style="background: var(--color-bg-sunken); color: var(--color-text-secondary);">删除</button>
                    </div>
                  </td>
                </tr>
                <!-- Row 4: 审批平台 -->
                <tr class="table-row-hover">
                  <td class="px-4 py-3">
                    <div class="flex items-center gap-2.5">
                      <div class="flex items-center justify-center w-8 h-8 rounded-md" style="background: var(--color-bg-sunken);">
                        <i data-lucide="file-check" style="width: 16px; height: 16px; color: var(--color-text-tertiary);"></i>
                      </div>
                      <div>
                        <div class="text-sm font-medium" style="color: var(--color-text-primary);">审批平台</div>
                      </div>
                    </div>
                  </td>
                  <td class="px-4 py-3">
                    <span class="text-sm font-mono" style="color: var(--color-text-tertiary);">未上传</span>
                  </td>
                  <td class="px-4 py-3">
                    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium" style="background: var(--color-bg-sunken); color: var(--color-text-tertiary);">未配置</span>
                  </td>
                  <td class="px-4 py-3">
                    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium" style="background: var(--color-bg-sunken); color: var(--color-text-tertiary);">已归档</span>
                  </td>
                  <td class="px-4 py-3 text-right">
                    <div class="flex items-center justify-end gap-2">
                      <button data-dom-id="btn-project-config" class="px-3 py-1 rounded text-xs font-medium cursor-pointer border-0" style="background: var(--color-primary); color: var(--color-text-inverse);">配置</button>
                      <button data-dom-id="btn-project-package" class="px-3 py-1 rounded text-xs font-medium cursor-pointer border-0" style="background: var(--state-success); color: var(--color-text-inverse);">打包</button>
                      <button class="download-btn flex items-center gap-1.5 px-3 py-1 rounded text-xs font-medium cursor-pointer transition-colors" data-has-package="false" data-project-name="审批平台" style="border:1px solid var(--color-border); color:var(--color-text-secondary); background:var(--color-bg-elevated);"
                              onmouseenter="this.style.borderColor='var(--color-primary)'; this.style.color='var(--color-primary)'"
                              onmouseleave="this.style.borderColor='var(--color-border)'; this.style.color='var(--color-text-secondary)'">
                        <i data-lucide="download" style="width:13px;height:13px;"></i>
                        <span>下载最新版本</span>
                      </button>
                      <button class="px-3 py-1 rounded text-xs font-medium cursor-pointer border-0" style="background: var(--color-bg-sunken); color: var(--color-text-secondary);">删除</button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Table Footer Info -->
          <div class="flex items-center justify-between mt-4 px-1">
            <span class="text-xs" style="color: var(--color-text-tertiary);">共 4 条记录</span>
            <div class="flex items-center gap-1">
              <button class="px-2.5 py-1 rounded text-xs cursor-pointer border-0" style="background: var(--color-bg-sunken); color: var(--color-text-tertiary);">上一页</button>
              <button class="px-2.5 py-1 rounded text-xs font-medium cursor-pointer border-0" style="background: var(--color-primary); color: var(--color-text-inverse);">1</button>
              <button class="px-2.5 py-1 rounded text-xs cursor-pointer border-0" style="background: var(--color-bg-sunken); color: var(--color-text-tertiary);">下一页</button>
            </div>
          </div>
        </div>
      </div>
      <style>
        .table-row-hover:hover { background: var(--color-bg-sunken); }
        .table-row-hover { transition: background 150ms ease; }
      </style>

      <!-- 下载提示 Modal -->
      <div id="download-prompt-overlay" style="display:none; position:fixed; inset:0; z-index:50; background:rgba(0,0,0,0.4); align-items:center; justify-content:center;">
        <div style="width:420px; background:#FFFFFF; border-radius:var(--radius-lg); box-shadow:var(--shadow-float); padding:var(--space-lg);">
          <div class="flex items-center gap-3 mb-4">
            <div class="flex items-center justify-center rounded-full" style="width:40px;height:40px;background:var(--state-warning-bg);">
              <i data-lucide="alert-triangle" style="width:20px;height:20px;color:var(--state-warning);"></i>
            </div>
            <h2 class="font-heading text-base" style="color:var(--color-text-primary);">无法下载</h2>
          </div>
          <p id="download-prompt-message" class="text-sm mb-5" style="color:var(--color-text-secondary); line-height:1.6;">该项目暂无可下载的打包产物。请先完成项目配置并成功打包后再下载。</p>
          <div style="display:flex; justify-content:flex-end; gap:var(--space-sm);">
            <button id="download-prompt-go-config" style="padding:6px 16px; border:none; border-radius:var(--radius-md); background:var(--color-primary); color:var(--color-text-inverse); font-size:14px; cursor:pointer;">前往配置</button>
            <button id="download-prompt-close" style="padding:6px 16px; border:1px solid var(--color-border); border-radius:var(--radius-md); background:var(--color-bg-elevated); color:var(--color-text-secondary); font-size:14px; cursor:pointer;">我知道了</button>
          </div>
        </div>
      </div>

      <!-- 新建项目 Modal -->
      <div id="modal-overlay" style="display:none; position:fixed; inset:0; z-index:50; background:rgba(0,0,0,0.4); align-items:center; justify-content:center;">
        <div id="modal-card" style="width:400px; background:#FFFFFF; border-radius:var(--radius-lg); box-shadow:var(--shadow-float); padding:var(--space-lg);">
          <h2 class="font-heading text-lg" style="color:var(--color-text-primary); margin-bottom:var(--space-lg);">新建项目</h2>
          <div style="margin-bottom:var(--space-md);">
            <label class="block text-sm font-medium" style="color:var(--color-text-secondary); margin-bottom:var(--space-xs);">项目名称</label>
            <input type="text" placeholder="请输入项目名称" style="width:100%; box-sizing:border-box; padding:8px 12px; border:1px solid var(--color-border); border-radius:var(--radius-md); font-size:14px; color:var(--color-text-primary); outline:none;" />
          </div>
          <div style="margin-bottom:var(--space-lg);">
            <label class="block text-sm font-medium" style="color:var(--color-text-secondary); margin-bottom:var(--space-xs);">项目描述</label>
            <textarea placeholder="简要描述项目用途，可选" rows="2" style="width:100%; box-sizing:border-box; padding:8px 12px; border:1px solid var(--color-border); border-radius:var(--radius-md); font-size:14px; color:var(--color-text-primary); outline:none; resize:vertical;"></textarea>
          </div>
          <div style="display:flex; justify-content:flex-end; gap:var(--space-sm);">
            <button id="modal-cancel" style="padding:6px 16px; border:1px solid var(--color-border); border-radius:var(--radius-md); background:var(--color-bg-elevated); color:var(--color-text-secondary); font-size:14px; cursor:pointer;">取消</button>
            <button id="modal-create" style="padding:6px 16px; border:none; border-radius:var(--radius-md); background:var(--color-primary); color:var(--color-text-inverse); font-size:14px; cursor:pointer;">创建</button>
          </div>
        </div>
      </div>
    </main>
    <script>lucide.createIcons();</script>
    <script>
      (function() {
        document.querySelectorAll('.download-btn').forEach(function(btn) {
          btn.addEventListener('click', function(e) {
            e.preventDefault();
            var hasPackage = this.getAttribute('data-has-package') === 'true';
            if (!hasPackage) {
              var name = this.getAttribute('data-project-name') || '该项目';
              document.getElementById('download-prompt-message').textContent = 
                '「' + name + '」暂无可下载的打包产物。请先完成项目配置并成功打包后再下载。';
              document.getElementById('download-prompt-overlay').style.display = 'flex';
            }
            // if hasPackage === true, proceed with download (no action needed in prototype)
          });
        });

        var dlOverlay = document.getElementById('download-prompt-overlay');
        document.getElementById('download-prompt-close').addEventListener('click', function() {
          dlOverlay.style.display = 'none';
        });
        document.getElementById('download-prompt-go-config').addEventListener('click', function() {
          dlOverlay.style.display = 'none';
          // In prototype, navigate to config page
        });
        dlOverlay.addEventListener('click', function(e) {
          if (e.target === dlOverlay) dlOverlay.style.display = 'none';
        });
      })();
    </script>
    <script>
      (function() {
        var overlay = document.getElementById('modal-overlay');
        var btnNew = document.getElementById('btn-new-project');
        var btnCancel = document.getElementById('modal-cancel');

        function openModal() {
          overlay.style.display = 'flex';
        }
        function closeModal() {
          overlay.style.display = 'none';
        }

        btnNew.addEventListener('click', openModal);
        btnCancel.addEventListener('click', closeModal);
        overlay.addEventListener('click', function(e) {
          if (e.target === overlay) closeModal();
        });
      })();
    </script>
</body>
</html>
